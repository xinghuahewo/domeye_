schema: spec-driven

context: |
  Domeye Core 是从旧项目隔离出的新项目。旧项目 /home/bgpdata/Domeye 及其数据库只读，
  backend/core/ 保持等字节不可变。P0 数据工作只允许在外围 data_pipeline、dev 工具、
  contracts、tests 和 docs 中建设旁路能力。

  当前变更针对 RIPE RIS rrc25 的伊朗国家路由中断研究闭环。研究窗口使用 UTC 半开区间，
  原始 MRT 只读，所有派生结果先落文件制品，不写任何数据库，不切换或部署生产，不修改前端。
  缺测、处理失败和未知不得表示为 0；P0 只给出观测结论，不把机制假设写成因果事实。

  项目文档统一使用中文。实现与验收遵守 50GB 新增原始读取、单次 10 分钟、5GB 临时空间
  和数据库写入审批边界。相同输入与配置必须得到稳定身份和相同语义结果。

rules:
  proposal:
    - 文档正文使用中文，并明确列出旧项目只读、backend/core 不变、无数据库写入、无生产部署和无前端修改。
    - 必须区分原始数据可用性、派生数据缺口、证据缺口和无法由 RRC25 验证的结论。
  specs:
    - 每项规范使用 MUST 或 MUST NOT 表达可验收要求，并至少包含一个 WHEN/THEN 场景。
    - 所有时间窗口必须使用带时区的半开区间，所有缺失值必须携带 value_state 和 missing_reason。
    - 不得把报告中的既有数字写成强制复现值，只能要求可复算、可对账和可追溯。
  design:
    - 必须解释 RIB seed、UPDATE 回放、VP 身份、双栈计量、episode/wave、文件制品、断点续跑和资源门禁。
    - 每个关键选择必须给出未采用方案及原因。
  tasks:
    - 任务按依赖顺序排列，每项都必须可单独验证。
    - 不得包含真实全量 A/B、生产数据库写入、backend/core 修改、前端修改或生产部署任务。
