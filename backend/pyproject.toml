[project]
name = "domeye-core"
version = "0.1.0"
description = "Domeye 路由异常检测核心精简版后端"
requires-python = ">=3.10,<3.11"
dependencies = [
    "authlib",
    "beautifulsoup4",
    "flask",
    "flask-cors",
    "flask-restful",
    "matplotlib",
    "netaddr",
    "networkx",
    "numpy",
    "openpyxl",
    "pandas",
    "psycopg2-binary",
    "pyinotify",
    "python-dateutil",
    "python-docx",
    "pytricia",
    "pytz",
    "requests",
    "seaborn",
    "xlrd",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
