server {
    listen 28471;
    listen [::]:28471;

    server_name _;
    server_tokens off;
    charset utf-8;

    root /home/bgpdata/Domeye-Core-runtime/web/dist;
    index index.html;

    access_log /var/log/nginx/domeye-core.access.log;
    error_log /var/log/nginx/domeye-core.error.log;

    client_max_body_size 2m;

    location = /api/v1 {
        return 308 /api/v1/;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:28473;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 125s;
        proxy_send_timeout 60s;
    }

    location = /api/v2 {
        return 308 /api/v2/;
    }

    location ^~ /api/v2/ {
        proxy_pass http://127.0.0.1:28473;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 60s;
    }

    location = /index.html {
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        rewrite ^ /index.html break;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* \.(?:css|js|ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
