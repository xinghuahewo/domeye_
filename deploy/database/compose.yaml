services:
  postgres:
    image: ${DOMEYE_CORE_DB_IMAGE:?必须设置 DOMEYE_CORE_DB_IMAGE}
    container_name: domeye_core_pg
    restart: unless-stopped
    mem_limit: 16g
    shm_size: 4g
    environment:
      POSTGRES_DB: ${DOMEYE_CORE_DB_NAME:?必须设置 DOMEYE_CORE_DB_NAME}
      POSTGRES_USER: ${DOMEYE_CORE_DB_ADMIN_USER:?必须设置 DOMEYE_CORE_DB_ADMIN_USER}
    ports:
      - "127.0.0.1:29429:5432"
    volumes:
      - /home/bgpdata/Domeye-Core-data/postgres:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - listen_addresses=*
      - -c
      - timescaledb.telemetry_level=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
